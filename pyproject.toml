[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-ai"
version = "1.0.0"
description = "Universal AI Agent Skills & Multi-Agent Ecosystem"
readme = "README.md"
authors = [{ name = "Nexora AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0"
]

[project.scripts]
nexora = "nexora.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "nexora*", "scripts*"]

